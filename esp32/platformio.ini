; E-SHIELD ESP32 firmware — PlatformIO project
; Board: generic ESP32 DevKit (change board= if you use a different module)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.15.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
